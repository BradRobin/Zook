version: '3.8'

# Zook Production Docker Compose Configuration
# Includes FastAPI backend, PostgreSQL database, and Cloudflare Tunnel

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zook-postgres-prod
    environment:
      POSTGRES_DB: zook
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-in-production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"  # Only expose on localhost
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Enable SSL for database connections
    command: 
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zook-backend-prod
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-this-in-production}@postgres:5432/zook
      DATABASE_SSL_MODE: require
      
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      
      # CORS - Update with your production domain
      CORS_ORIGINS: ${PRODUCTION_URL}
      
      # Application
      ENVIRONMENT: production
      API_V1_STR: /api
      PROJECT_NAME: Zook Auth Server
      
      # HTTPS & Security
      USE_HTTPS: "true"
      ENFORCE_HTTPS_REDIRECT: "true"
      CLOUDFLARE_TUNNEL_ENABLED: "true"
      PRODUCTION_URL: ${PRODUCTION_URL}
      
      # Detection Model
      USE_CUSTOM_MODEL: "true"
      CUSTOM_MODEL_PATH: app/models/custom_knife_model.pt
      DETECTION_DEVICE: cpu
      DETECTION_CONFIDENCE_THRESHOLD: 0.90
    
    volumes:
      # Mount recordings directory for persistent storage
      - recordings:/app/recordings
      # Mount custom model if available
      - ./backend/app/models:/app/app/models:ro
    
    ports:
      - "127.0.0.1:8000:8000"  # Only expose on localhost (Cloudflare Tunnel will proxy)
    
    networks:
      - internal
    
    depends_on:
      postgres:
        condition: service_healthy
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zook-cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      # Mount tunnel configuration
      - ./backend/cloudflare-tunnel.yml:/etc/cloudflared/config.yml:ro
      - ./backend/cloudflare-credentials.json:/etc/cloudflared/credentials.json:ro
    networks:
      - internal
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  internal:
    driver: bridge
    name: zook-network

volumes:
  postgres_data:
    driver: local
  recordings:
    driver: local

# Usage Instructions:
#
# 1. Create .env file in project root with:
#    POSTGRES_USER=postgres
#    POSTGRES_PASSWORD=your-strong-password
#    JWT_SECRET_KEY=your-jwt-secret-key
#    PRODUCTION_URL=https://zook.yourdomain.com
#    CLOUDFLARE_TUNNEL_TOKEN=your-tunnel-token
#
# 2. Set up Cloudflare Tunnel:
#    - Follow backend/cloudflare-tunnel-setup.md
#    - Place cloudflare-tunnel.yml and cloudflare-credentials.json in backend/
#
# 3. Start services:
#    docker-compose -f docker-compose.production.yml up -d
#
# 4. Check logs:
#    docker-compose -f docker-compose.production.yml logs -f
#
# 5. Stop services:
#    docker-compose -f docker-compose.production.yml down
#
# 6. Backup data:
#    docker-compose -f docker-compose.production.yml exec postgres \
#      pg_dump -U postgres zook > backup.sql

